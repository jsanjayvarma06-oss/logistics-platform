<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prodis — Product & Dispatch Platform</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />

    <!-- Leaflet CSS + JS (free, no API key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      /* Fix Leaflet z-index inside dark UI */
      .leaflet-container { background: #1a1d27; }
      .leaflet-tile { filter: brightness(0.85) saturate(0.9); }
      .leaflet-popup-content-wrapper {
        background: #1a1d27;
        border: 1px solid #2a2d3a;
        border-radius: 8px;
        color: #e4e4e7;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      .leaflet-popup-tip { background: #1a1d27; }
      .leaflet-popup-close-button { color: #71717a !important; }
      .leaflet-control-zoom a {
        background: #1a1d27 !important;
        color: #e4e4e7 !important;
        border-color: #2a2d3a !important;
      }
      .leaflet-control-attribution {
        background: rgba(26,29,39,0.8) !important;
        color: #71717a !important;
        font-size: 10px;
      }
      .leaflet-control-attribution a { color: #6366f1 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

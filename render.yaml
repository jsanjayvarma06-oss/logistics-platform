services:
  # ── Inventory Service ──
  - type: web
    name: logistics-inventory
    runtime: node
    region: singapore
    plan: free
    rootDir: services/inventory-service
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: QSTASH_TOKEN
        sync: false
      - key: DISPATCH_SERVICE_URL
        fromService:
          name: logistics-dispatch
          type: web
          property: hostport
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ── Dispatch Service ──
  - type: web
    name: logistics-dispatch
    runtime: node
    region: singapore
    plan: free
    rootDir: services/dispatch-service
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: MONGODB_URI
        sync: false
      - key: QSTASH_TOKEN
        sync: false
      - key: INVENTORY_SERVICE_URL
        fromService:
          name: logistics-inventory
          type: web
          property: hostport
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ── Argcord Console ──
  - type: web
    name: argcord-console
    runtime: static
    region: singapore
    plan: free
    rootDir: console
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_INVENTORY_URL
        fromService:
          name: logistics-inventory
          type: web
          property: hostport
      - key: VITE_DISPATCH_URL
        fromService:
          name: logistics-dispatch
          type: web
          property: hostport
      - key: VITE_TENANT_ID
        value: demo-tenant

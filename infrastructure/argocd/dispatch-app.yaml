apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dispatch-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/logistics-platform.git
    targetRevision: main
    path: infrastructure/k8s/base
    kustomize:
      namePrefix: dispatch-
      images:
        - ghcr.io/your-org/dispatch-service:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: logistics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
